name: Hourly Costco Deal Check

on:
  schedule:
    # Changed from 0 to 17 to bypass GitHub's top-of-the-hour traffic jam
    - cron: '17 */3 * * *'
  workflow_dispatch:

# Fixes the Node 20 deprecation warning globally
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    # REQUIRED: Allows the action to push the state and history files back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Updated from v4 to v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Scraper
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          PRICE_CLIENT_IDENTIFIER: ${{ secrets.PRICE_CLIENT_IDENTIFIER }}
          PRICE_CLIENT_ID: ${{ secrets.PRICE_CLIENT_ID }}
          INV_CLIENT_IDENTIFIER: ${{ secrets.INV_CLIENT_IDENTIFIER }}
          COSTCO_ZIP_CODE: ${{ secrets.COSTCO_ZIP_CODE }}
          COSTCO_WHS_NUMBER: ${{ secrets.COSTCO_WHS_NUMBER }}
        run: python Github_lego_Costco_scraper.py

      - name: Commit and Push Tracking Files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Stage the state tracker and the historical CSV
          git add state.json price_history.csv
          
          # Check if there are staged changes before attempting to commit
          if git diff --staged --quiet; then
            echo "No changes to state or history. Skipping commit."
          else
            git commit -m "chore: update tracking state and history [skip ci]"
            git push
          fi
